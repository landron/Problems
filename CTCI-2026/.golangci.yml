version: "2"
run:
  tests: true
linters:
  enable:
    - gocognit
    - gocritic
    - gocyclo
    - misspell
    - nakedret
    - prealloc
    - revive
    - unparam
  settings:
    gocognit:
      min-complexity: 10
    gocyclo:
      min-complexity: 10
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
